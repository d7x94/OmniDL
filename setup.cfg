[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[coverage:run]
omit =
    api/*
    ui/*
    tests/*
    build/*
    main.py
    infrastructure/downloader/gallery_dl_engine.py
    infrastructure/downloader/facebook_story_engine.py
    utils/instagram_live_checker.py

[coverage:report]
fail_under = 79
show_missing = True
