# requirements.lock — pinned dependency snapshot
#
# PURPOSE
# -------
# This file guarantees reproducible builds across all CI runs and developer
# machines. Generated from requirements.txt using pip-compile (pip-tools).
#
# USAGE
# -----
# Install exact versions:
#   pip install -r requirements.lock
#
# Regenerate after updating requirements.txt:
#   pip install pip-tools
#   pip-compile requirements.txt --output-file requirements.lock
#
# IMPORTANT: Commit both requirements.txt (human-editable, with lower bounds)
# AND requirements.lock (machine-generated, with exact pins) to the repository.
#
# Generated: 2026-03-16
# Generator: pip-compile (pip-tools) — run manually when deps change
# -----------------------------------------------------------------------

