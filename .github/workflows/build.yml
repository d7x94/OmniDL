name: Build & Release

on:
  push:
    branches: [main, improve]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION:                  "3.13"
  PYINSTALLER_VERSION:             "6.19.0"
  APP_NAME:                        "OmniDL"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  # ── JOB 1: Test gate ──────────────────────────────────────────────────────
  test:
    name: "Test gate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra api --extra dev

      - name: Lint with ruff
        run: uv run ruff check . --select=E,F,B,I --exclude=tests/,build/,venv_build/

      - name: Type check with mypy
        run: |
          uv run mypy domain/ app/ infrastructure/ utils/ \
            --ignore-missing-imports \
            --no-strict-optional

      - name: Run test suite
        run: |
          uv run pytest \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_logger_and_manager_extra.py \
            --tb=short -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-build
          path: coverage.xml
          retention-days: 7

  # ── JOB 2: Security scan ─────────────────────────────────────────────────
  security:
    name: "Security scan"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: uv tool install bandit && uv tool install pip-audit

      - name: bandit SAST scan
        run: |
          uv tool run bandit \
            -r . \
            -x tests/,build/,venv_build/ \
            -ll \
            --format txt \
            --output bandit_report.txt \
            || (cat bandit_report.txt && exit 1)

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-build
          path: bandit_report.txt
          retention-days: 7

      - name: pip-audit CVE scan
        run: |
          uv export --extra api --no-dev --frozen > /tmp/requirements-audit.txt
          touch pip_audit_report.md
          uv tool run pip-audit \
            --requirement /tmp/requirements-audit.txt \
            --format markdown \
            --output pip_audit_report.md \
            || (cat pip_audit_report.md && exit 1)

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report-build
          path: pip_audit_report.md
          retention-days: 7

  # ── JOB 3: Resolve latest tool packages ─────────────────────────────────
  prepare:
    name: "Resolve latest tool packages"
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade tool packages to latest
        run: uv lock --upgrade-package yt-dlp --upgrade-package gallery-dl --upgrade-package playwright

      - name: Upload updated lock file
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
          retention-days: 1

  # ── JOB 4: Windows EXE ───────────────────────────────────────────────────
  build-windows:
    name: "Build — Windows EXE"
    runs-on: windows-latest
    needs: [prepare]

    outputs:
      asset-name: ${{ steps.package.outputs.asset-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updated lock file
        uses: actions/download-artifact@v4
        with:
          name: uv-lock

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies + PyInstaller
        run: uv sync --extra api --extra build

      - name: Download FFmpeg (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $tmp = "$env:RUNNER_TEMP\ffmpeg_extracted"

          Write-Output "Downloading FFmpeg from $url ..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

          Write-Output "Extracting archive ..."
          Expand-Archive -Path $zip -DestinationPath $tmp -Force

          $binDir = Get-ChildItem -Path $tmp -Recurse -Filter "ffmpeg.exe" |
                      Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $binDir) {
            Write-Error "ffmpeg.exe not found inside the downloaded archive."
            exit 1
          }

          New-Item -ItemType Directory -Path "resources\ffmpeg" -Force | Out-Null
          Copy-Item "$binDir\ffmpeg.exe"  "resources\ffmpeg\ffmpeg.exe"
          Copy-Item "$binDir\ffprobe.exe" "resources\ffmpeg\ffprobe.exe"

          Remove-Item -Recurse -Force $zip, $tmp

          Write-Output "FFmpeg staged:"
          Get-Item "resources\ffmpeg\*.exe" |
            Format-Table Name, @{N="Size";E={"{0:N0} bytes" -f $_.Length}}

      - name: Verify FFmpeg binaries (Windows)
        shell: pwsh
        run: |
          foreach ($bin in @("resources\ffmpeg\ffmpeg.exe","resources\ffmpeg\ffprobe.exe")) {
            if (-not (Test-Path $bin)) {
              Write-Error "$bin is missing — download step failed."; exit 1
            }
          }
          & "resources\ffmpeg\ffmpeg.exe"  -version 2>&1 | Select-Object -First 1
          & "resources\ffmpeg\ffprobe.exe" -version 2>&1 | Select-Object -First 1
          Write-Output "OK  FFmpeg binaries verified"

      - name: Download Deno (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip"
          $zip = "$env:RUNNER_TEMP\deno.zip"
          Write-Output "Downloading Deno from $url ..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          New-Item -ItemType Directory -Path "resources\deno" -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath "resources\deno" -Force
          Remove-Item -Force $zip
          Write-Output "Deno staged:"
          Get-Item "resources\deno\deno.exe" | Format-Table Name, @{N="Size";E={"{0:N0} bytes" -f $_.Length}}

      - name: Verify Deno (Windows)
        shell: pwsh
        run: |
          $deno = "resources\deno\deno.exe"
          if (-not (Test-Path $deno)) { Write-Error "deno.exe missing"; exit 1 }
          & $deno --version 2>&1 | Select-Object -First 1
          Write-Output "OK  Deno binary verified"

      - name: Download gallery-dl (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "resources\gallery-dl" | Out-Null
          # gallery-dl moved to Codeberg — query Codeberg releases API
          $releases = Invoke-RestMethod -Uri "https://codeberg.org/api/v1/repos/mikf/gallery-dl/releases?limit=10" -UseBasicParsing
          $url = $null
          foreach ($rel in $releases) {
            $asset = $rel.assets | Where-Object { $_.name -eq "gallery-dl.exe" } | Select-Object -First 1
            if ($asset) { $url = $asset.browser_download_url; break }
          }
          if (-not $url) { Write-Error "gallery-dl.exe not found in last 10 releases"; exit 1 }
          Write-Output "Downloading gallery-dl from $url ..."
          Invoke-WebRequest -Uri $url -OutFile "resources\gallery-dl\gallery-dl.exe" -UseBasicParsing
          $size = (Get-Item "resources\gallery-dl\gallery-dl.exe").Length
          Write-Output "OK  gallery-dl.exe  ($size bytes)"

      - name: Verify gallery-dl (Windows)
        shell: pwsh
        run: |
          $exe = "resources\gallery-dl\gallery-dl.exe"
          if (-not (Test-Path $exe)) { Write-Error "gallery-dl.exe missing"; exit 1 }
          & $exe --version 2>&1 | Select-Object -First 1
          Write-Output "OK  gallery-dl binary verified"

      - name: Resolve icon flag
        id: icon
        shell: pwsh
        run: |
          if (Test-Path "assets/icons/app.ico") {
            "flag=--icon assets/icons/app.ico" | Out-File -Append $env:GITHUB_OUTPUT
          } else {
            "flag=" | Out-File -Append $env:GITHUB_OUTPUT
          }

      - name: PyInstaller build
        shell: pwsh
        run: |
          uv run pyinstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --name "${{ env.APP_NAME }}" `
            ${{ steps.icon.outputs.flag }} `
            --add-data "config.json;." `
            --add-data "resources/ffmpeg;ffmpeg" `
            --add-data "resources/deno;deno" `
            --add-data "resources/gallery-dl;gallery-dl" `
            --add-data "api/static;api/static" `
            --hidden-import multiprocessing `
            --hidden-import multiprocessing.freeze_support `
            --hidden-import customtkinter `
            --hidden-import yt_dlp `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageTk `
            --hidden-import requests `
            --hidden-import packaging `
            --collect-all customtkinter `
            --collect-all tkinter `
            --collect-all yt_dlp `
            --collect-all fastapi `
            --collect-all uvicorn `
            --collect-all keyring `
            --hidden-import fastapi `
            --hidden-import uvicorn `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import keyring.backends `
            --hidden-import keyring.backends.Windows `
            --hidden-import keyring.backends.fail `
            --hidden-import win32ctypes `
            --hidden-import win32ctypes.core `
            --hidden-import curl_cffi `
            --hidden-import curl_cffi.requests `
            --collect-all curl_cffi `
            --noupx `
            --distpath dist `
            main.py

      - name: Verify EXE and FFmpeg bundle (Windows)
        shell: pwsh
        run: |
          $exe = "dist\${{ env.APP_NAME }}\${{ env.APP_NAME }}.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "${{ env.APP_NAME }}.exe not found."; exit 1
          }
          Write-Output ("OK  {0}  ({1:N1} MB)" -f "${{ env.APP_NAME }}.exe",
                        ((Get-Item $exe).Length / 1MB))

          foreach ($bin in @("dist\${{ env.APP_NAME }}\_internal\ffmpeg\ffmpeg.exe",
                              "dist\${{ env.APP_NAME }}\_internal\ffmpeg\ffprobe.exe")) {
            if (-not (Test-Path $bin)) {
              Write-Error "Bundled binary missing from dist: $bin"; exit 1
            }
            Write-Output ("OK  {0}  ({1:N0} KB)" -f $bin,
                          ((Get-Item $bin).Length / 1KB))
          }
          Write-Output "OK  FFmpeg bundle verified inside dist/"

      - name: Write build-info.txt
        shell: pwsh
        run: |
          $ffVer = (& "dist\${{ env.APP_NAME }}\_internal\ffmpeg\ffmpeg.exe" -version 2>&1 |
                    Select-Object -First 1)
          @"
          ${{ env.APP_NAME }} — Build Info
          ─────────────────────────────────
          Version : ${{ github.ref_name }}
          Commit  : ${{ github.sha }}
          Run     : ${{ github.run_number }}
          Built   : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss' -AsUTC) UTC
          Runner  : ${{ runner.os }} / ${{ runner.arch }}
          Python  : $(python --version)
          FFmpeg  : $ffVer
          "@ | Out-File -FilePath "dist\${{ env.APP_NAME }}\build-info.txt" -Encoding utf8

      - name: Package distribution folder
        id: package
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}"
          $name = "${{ env.APP_NAME }}-${tag}-windows.zip"
          Compress-Archive -Path "dist\${{ env.APP_NAME }}\*" -DestinationPath $name
          $mb = [math]::Round((Get-Item $name).Length / 1MB, 1)
          Write-Output "OK  $name  ($mb MB)"
          "asset-name=$name" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: ${{ steps.package.outputs.asset-name }}
          retention-days: 7
          if-no-files-found: error

  # ── JOB 5: macOS .app ────────────────────────────────────────────────────
  build-macos:
    name: "Build — macOS .app"
    runs-on: macos-latest
    needs: [prepare]
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}

    outputs:
      asset-name: ${{ steps.package.outputs.asset-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updated lock file
        uses: actions/download-artifact@v4
        with:
          name: uv-lock

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies + PyInstaller
        run: uv sync --extra api --extra build

      - name: Download FFmpeg (macOS)
        run: |
          set -euo pipefail
          mkdir -p resources/ffmpeg

          echo "Downloading ffmpeg ..."
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" \
            -o /tmp/ffmpeg.zip
          unzip -jo /tmp/ffmpeg.zip -d resources/ffmpeg
          rm /tmp/ffmpeg.zip

          echo "Downloading ffprobe ..."
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" \
            -o /tmp/ffprobe.zip
          unzip -jo /tmp/ffprobe.zip -d resources/ffmpeg
          rm /tmp/ffprobe.zip

          chmod +x resources/ffmpeg/ffmpeg resources/ffmpeg/ffprobe

          echo "FFmpeg staged:"
          ls -lh resources/ffmpeg/

      - name: Verify FFmpeg binaries (macOS)
        run: |
          for bin in resources/ffmpeg/ffmpeg resources/ffmpeg/ffprobe; do
            [ -f "$bin" ] || { echo "ERROR: $bin missing"; exit 1; }
            "./$bin" -version 2>&1 | head -1
          done
          echo "OK  FFmpeg binaries verified"

      - name: Download Deno (macOS)
        run: |
          set -euo pipefail
          mkdir -p resources/deno
          curl -fsSL --retry 3 \
            "https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip" \
            -o /tmp/deno.zip 2>/dev/null || \
          curl -fsSL --retry 3 \
            "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-apple-darwin.zip" \
            -o /tmp/deno.zip
          unzip -jo /tmp/deno.zip -d resources/deno
          rm /tmp/deno.zip
          chmod +x resources/deno/deno
          echo "Deno staged: $(resources/deno/deno --version | head -1)"

      - name: Verify Deno (macOS)
        run: |
          [ -f resources/deno/deno ] || { echo "ERROR: deno missing"; exit 1; }
          resources/deno/deno --version 2>&1 | head -1
          echo "OK  Deno binary verified"

      - name: Download gallery-dl (macOS)
        run: |
          set -euo pipefail
          mkdir -p resources/gallery-dl
          echo "Downloading gallery-dl ..."
          # gallery-dl moved to Codeberg — query Codeberg releases API
          url=$(curl -fsSL "https://codeberg.org/api/v1/repos/mikf/gallery-dl/releases?limit=10" \
            | jq -r '[.[].assets[] | select(.name == "gallery-dl.bin")] | first | .browser_download_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then echo "ERROR: gallery-dl.bin not found"; exit 1; fi
          curl -fsSL --retry 3 --retry-delay 5 "$url" -o resources/gallery-dl/gallery-dl
          chmod +x resources/gallery-dl/gallery-dl
          echo "OK  gallery-dl  ($(du -sh resources/gallery-dl/gallery-dl | cut -f1))"

      - name: Verify gallery-dl (macOS)
        run: |
          [ -f resources/gallery-dl/gallery-dl ] || { echo "ERROR: gallery-dl missing"; exit 1; }
          resources/gallery-dl/gallery-dl --version 2>&1 | head -1
          echo "OK  gallery-dl binary verified"

      - name: Resolve icon flag
        id: icon
        run: |
          if [ -f "assets/icons/app.icns" ]; then
            echo "flag=--icon assets/icons/app.icns" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: PyInstaller build
        run: |
          uv run pyinstaller \
            --noconfirm \
            --onedir \
            --windowed \
            --name "${{ env.APP_NAME }}" \
            ${{ steps.icon.outputs.flag }} \
            --add-data "config.json:." \
            --add-data "resources/ffmpeg:ffmpeg" \
            --add-data "resources/deno:deno" \
            --add-data "resources/gallery-dl:gallery-dl" \
            --add-data "api/static:api/static" \
            --hidden-import multiprocessing \
            --hidden-import multiprocessing.freeze_support \
            --hidden-import customtkinter \
            --hidden-import yt_dlp \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageTk \
            --hidden-import requests \
            --hidden-import packaging \
            --collect-all customtkinter \
            --collect-all tkinter \
            --collect-all yt_dlp \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all keyring \
            --hidden-import fastapi \
            --hidden-import uvicorn \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import keyring.backends \
            --hidden-import keyring.backends.macOS \
            --hidden-import keyring.backends.fail \
            --hidden-import curl_cffi \
            --hidden-import curl_cffi.requests \
            --collect-all curl_cffi \
            --noupx \
            --distpath dist \
            main.py

      - name: Verify .app and FFmpeg bundle (macOS)
        run: |
          [ -d "dist/${{ env.APP_NAME }}.app" ] || {
            echo "ERROR: .app not found"; exit 1
          }
          echo "OK  ${{ env.APP_NAME }}.app  ($(du -sh "dist/${{ env.APP_NAME }}.app" | cut -f1))"

          APP_BUNDLE="dist/${{ env.APP_NAME }}.app"
          for bin in ffmpeg ffprobe; do
            full=$(find "$APP_BUNDLE" -name "$bin" -type f | head -1)
            if [ -z "$full" ]; then
              echo "ERROR: $bin not found inside $APP_BUNDLE"
              find "$APP_BUNDLE" -maxdepth 6 -name "ff*" | head -20 || true
              exit 1
            fi
            echo "OK  $full  ($(du -sh "$full" | cut -f1))"
          done
          echo "OK  FFmpeg bundle verified inside .app"

      - name: Write build-info.txt
        run: |
          APP_BUNDLE="dist/${{ env.APP_NAME }}.app"
          FFMPEG_BIN=$(find "$APP_BUNDLE" -name "ffmpeg" -type f | head -1)
          FF_VER=$("$FFMPEG_BIN" -version 2>&1 | head -1 || echo "unknown")
          MACOS="$APP_BUNDLE/Contents/MacOS"
          cat > "$MACOS/build-info.txt" <<EOF
          ${{ env.APP_NAME }} — Build Info
          ─────────────────────────────────
          Version : ${{ github.ref_name }}
          Commit  : ${{ github.sha }}
          Run     : ${{ github.run_number }}
          Built   : $(date -u '+%Y-%m-%d %H:%M:%S') UTC
          Runner  : ${{ runner.os }} / ${{ runner.arch }}
          Python  : $(python --version)
          FFmpeg  : ${FF_VER}
          EOF

      - name: Sign .app bundle
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_CERT_P12:      ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 \
            -k build.keychain \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "" build.keychain
          security default-keychain -s build.keychain
          codesign \
            --deep --force --verify --verbose \
            --sign "Developer ID Application: ${{ env.APP_NAME }} ($APPLE_TEAM_ID)" \
            --options runtime \
            "dist/${{ env.APP_NAME }}.app"
          echo "OK  Code signing complete"

      - name: Notarize .app bundle
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent \
            "dist/${{ env.APP_NAME }}.app" \
            "dist/${{ env.APP_NAME }}-notarize.zip"
          xcrun notarytool submit "dist/${{ env.APP_NAME }}-notarize.zip" \
            --apple-id   "$APPLE_ID" \
            --password   "$APPLE_APP_PASSWORD" \
            --team-id    "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "dist/${{ env.APP_NAME }}.app"
          rm -f "dist/${{ env.APP_NAME }}-notarize.zip"
          echo "OK  Notarization and stapling complete"

      - name: Package .app bundle
        id: package
        run: |
          TAG="${{ github.ref_name }}"
          NAME="${{ env.APP_NAME }}-${TAG}-macos.zip"
          ditto -c -k --keepParent "dist/${{ env.APP_NAME }}.app" "$NAME"
          echo "OK  $NAME  ($(du -sh "$NAME" | cut -f1))"
          echo "asset-name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: ${{ steps.package.outputs.asset-name }}
          retention-days: 7
          if-no-files-found: error

  # ── JOB 6: Linux tarball ──────────────────────────────────────────────────
  build-linux:
    name: "Build — Linux tarball"
    runs-on: ubuntu-latest
    needs: [prepare]

    outputs:
      asset-name: ${{ steps.package.outputs.asset-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updated lock file
        uses: actions/download-artifact@v4
        with:
          name: uv-lock

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies + PyInstaller
        run: uv sync --extra api --extra build

      - name: Download FFmpeg (Linux)
        run: |
          set -euo pipefail
          mkdir -p resources/ffmpeg

          ARCH="amd64"
          BASE_URL="https://johnvansickle.com/ffmpeg/releases"
          TARBALL="ffmpeg-release-${ARCH}-static.tar.xz"

          echo "Downloading $TARBALL ..."
          curl -fsSL --retry 3 --retry-delay 5 \
            "${BASE_URL}/${TARBALL}" -o /tmp/ffmpeg.tar.xz

          tar -xJf /tmp/ffmpeg.tar.xz \
            --wildcards \
            --no-anchored \
            --strip-components=1 \
            -C resources/ffmpeg \
            '*/ffmpeg' '*/ffprobe'

          rm /tmp/ffmpeg.tar.xz
          chmod +x resources/ffmpeg/ffmpeg resources/ffmpeg/ffprobe

          echo "FFmpeg staged:"
          ls -lh resources/ffmpeg/

      - name: Verify FFmpeg binaries (Linux)
        run: |
          for bin in resources/ffmpeg/ffmpeg resources/ffmpeg/ffprobe; do
            [ -f "$bin" ] || { echo "ERROR: $bin missing"; exit 1; }
            "./$bin" -version 2>&1 | head -1
          done
          echo "OK  FFmpeg binaries verified"

      - name: Download Deno (Linux)
        run: |
          set -euo pipefail
          mkdir -p resources/deno
          curl -fsSL --retry 3 \
            "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip" \
            -o /tmp/deno.zip
          unzip -jo /tmp/deno.zip -d resources/deno
          rm /tmp/deno.zip
          chmod +x resources/deno/deno
          echo "Deno staged: $(resources/deno/deno --version | head -1)"

      - name: Verify Deno (Linux)
        run: |
          [ -f resources/deno/deno ] || { echo "ERROR: deno missing"; exit 1; }
          resources/deno/deno --version 2>&1 | head -1
          echo "OK  Deno binary verified"

      - name: Download gallery-dl (Linux)
        run: |
          set -euo pipefail
          mkdir -p resources/gallery-dl
          echo "Downloading gallery-dl ..."
          # gallery-dl moved to Codeberg — query Codeberg releases API
          url=$(curl -fsSL "https://codeberg.org/api/v1/repos/mikf/gallery-dl/releases?limit=10" \
            | jq -r '[.[].assets[] | select(.name == "gallery-dl.bin")] | first | .browser_download_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then echo "ERROR: gallery-dl.bin not found"; exit 1; fi
          curl -fsSL --retry 3 --retry-delay 5 "$url" -o resources/gallery-dl/gallery-dl
          chmod +x resources/gallery-dl/gallery-dl
          echo "OK  gallery-dl  ($(du -sh resources/gallery-dl/gallery-dl | cut -f1))"

      - name: Verify gallery-dl (Linux)
        run: |
          [ -f resources/gallery-dl/gallery-dl ] || { echo "ERROR: gallery-dl missing"; exit 1; }
          resources/gallery-dl/gallery-dl --version 2>&1 | head -1
          echo "OK  gallery-dl binary verified"

      - name: PyInstaller build
        run: |
          uv run pyinstaller \
            --noconfirm \
            --onedir \
            --name "${{ env.APP_NAME }}" \
            --add-data "config.json:." \
            --add-data "resources/ffmpeg:ffmpeg" \
            --add-data "resources/deno:deno" \
            --add-data "resources/gallery-dl:gallery-dl" \
            --add-data "api/static:api/static" \
            --hidden-import multiprocessing \
            --hidden-import multiprocessing.freeze_support \
            --hidden-import customtkinter \
            --hidden-import yt_dlp \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageTk \
            --hidden-import requests \
            --hidden-import packaging \
            --collect-all customtkinter \
            --collect-all tkinter \
            --collect-all yt_dlp \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all keyring \
            --hidden-import fastapi \
            --hidden-import uvicorn \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import keyring.backends \
            --hidden-import keyring.backends.SecretService \
            --hidden-import keyring.backends.fail \
            --hidden-import curl_cffi \
            --hidden-import curl_cffi.requests \
            --collect-all curl_cffi \
            --noupx \
            --distpath dist \
            main.py

      - name: Verify build and FFmpeg bundle (Linux)
        run: |
          bin="dist/${{ env.APP_NAME }}/${{ env.APP_NAME }}"
          [ -f "$bin" ] || { echo "ERROR: binary not found at $bin"; exit 1; }
          echo "OK  $bin  ($(du -sh "$bin" | cut -f1))"
          for ff in ffmpeg ffprobe; do
            found=$(find "dist/${{ env.APP_NAME }}" -name "$ff" -type f | head -1)
            [ -n "$found" ] || { echo "ERROR: $ff not in bundle"; exit 1; }
            echo "OK  $found  ($(du -sh "$found" | cut -f1))"
          done
          echo "OK  FFmpeg bundle verified"

      - name: Write build-info.txt
        run: |
          FFMPEG_BIN=$(find "dist/${{ env.APP_NAME }}" -name "ffmpeg" -type f | head -1)
          FF_VER=$("$FFMPEG_BIN" -version 2>&1 | head -1 || echo "unknown")
          cat > "dist/${{ env.APP_NAME }}/build-info.txt" <<EOF
          ${{ env.APP_NAME }} — Build Info
          ─────────────────────────────────
          Version : ${{ github.ref_name }}
          Commit  : ${{ github.sha }}
          Run     : ${{ github.run_number }}
          Built   : $(date -u '+%Y-%m-%d %H:%M:%S') UTC
          Runner  : ${{ runner.os }} / ${{ runner.arch }}
          Python  : $(python --version)
          FFmpeg  : ${FF_VER}
          EOF

      - name: Package distribution folder
        id: package
        run: |
          TAG="${{ github.ref_name }}"
          NAME="${{ env.APP_NAME }}-${TAG}-linux.tar.gz"
          tar -czf "$NAME" -C dist "${{ env.APP_NAME }}"
          echo "OK  $NAME  ($(du -sh "$NAME" | cut -f1))"
          echo "asset-name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: ${{ steps.package.outputs.asset-name }}
          retention-days: 7
          if-no-files-found: error

  # ── JOB 6: GitHub Release (tag builds only) ──────────────────────────────
  # ── JOB 7: GitHub Release (tag builds only) ──────────────────────────────
  release:
    name: "GitHub Release — ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: release-assets/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets/

      - name: Verify release assets
        run: |
          echo "Staged release assets:"
          ls -lh release-assets/
          count=$(find release-assets/ -name "*.zip" -o -name "*.tar.gz" | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "ERROR: expected 3 release files (win zip + mac zip + linux tar.gz), found $count" >&2
            exit 1
          fi
          echo "OK  All three platform packages present"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  ${{ github.ref_name }}
          name:      "${{ env.APP_NAME }} ${{ github.ref_name }}"
          draft:     false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
