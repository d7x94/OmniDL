# ──────────────────────────────────────────────────────────────────────────────
# OmniDL v16 — CI Pipeline
# Triggers: every push and every pull request (all branches)
#
# Jobs:
#   test    → pytest (non-UI tests) + coverage report
#   security → bandit (SAST) + pip-audit (CVE scan)
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel redundant runs on the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Tests
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: "pytest (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    # FIX D-3: test across multiple Python versions to catch compatibility issues
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── Install dependencies ───────────────────────────────────────────────
      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install dev/test dependencies
        run: pip install pytest pytest-cov

      # FIX D-1: add linting and type-checking so style/type regressions
      # are caught before they reach the main branch.
      - name: Install linters
        run: pip install ruff mypy

      # ── Lint ──────────────────────────────────────────────────────────────
      # E = pycodestyle errors, F = pyflakes, B = flake8-bugbear, I = isort
      - name: Ruff lint
        run: ruff check . --select=E,F,B,I --exclude=tests/,build/,venv_build/

      # ── Type check ─────────────────────────────────────────────────────────
      # Domain, application, infrastructure, and utility layers only.
      # UI excluded — customtkinter stubs are not available.
      - name: Mypy type check
        run: |
          mypy domain/ app/ infrastructure/ utils/ \
            --ignore-missing-imports \
            --no-strict-optional

      # ── Run tests (exclude UI — requires a display) ────────────────────────
      # UI tests live in ui/ and reference customtkinter widgets; they require
      # a real or virtual display (Xvfb). All other tests run headlessly fine.
      - name: Run pytest
        run: |
          pytest \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_logger_and_manager_extra.py \
            --tb=short \
            -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # ── Upload coverage report as artifact ────────────────────────────────
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Security scan
  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: "Security scan"
    runs-on: ubuntu-latest
    # Run in parallel with tests — does not need test results
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install security tools
        run: pip install bandit pip-audit

      # ── bandit: static analysis for common security issues ────────────────
      # Severity threshold: MEDIUM (-ll).  HIGH findings fail the build.
      # Skips test files (B101 assert usage is expected in tests).
      - name: bandit SAST scan
        run: |
          bandit \
            -r . \
            -x tests/,build/,venv_build/ \
            -ll \
            --format txt \
            --output bandit_report.txt \
            || (cat bandit_report.txt && exit 1)

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit_report.txt
          retention-days: 7

      # ── pip-audit: CVE scan of pinned dependencies ────────────────────────
      # --require-hashes would be ideal but requires a locked requirements file.
      # For now we scan for known CVEs and fail on any HIGH/CRITICAL finding.
      - name: pip-audit CVE scan
        run: |
          pip install -r requirements.txt
          pip-audit \
            --requirement requirements.txt \
            --format markdown \
            --output pip_audit_report.md \
            || (cat pip_audit_report.md && exit 1)

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip_audit_report.md
          retention-days: 7
