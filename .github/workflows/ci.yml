name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  test:
    name: "pytest (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get install -y libegl1

      - name: Install dependencies
        run: uv sync --extra api --extra dev

      - name: Ruff lint
        run: uv run ruff check . --select=E,F,B,I --exclude=tests/,build/,venv_build/

      - name: Mypy type check
        run: |
          uv run mypy domain/ app/ infrastructure/ utils/ \
            --ignore-missing-imports \
            --no-strict-optional

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_logger_and_manager_extra.py \
            --tb=short \
            -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  security:
    name: "Security scan"
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install security tools
        run: uv tool install bandit && uv tool install pip-audit

      - name: bandit SAST scan
        run: |
          uv tool run bandit \
            -r . \
            -x ./tests,./build,./venv_build \
            -ll \
            --format txt \
            --output bandit_report.txt \
            || (cat bandit_report.txt && exit 1)

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit_report.txt
          retention-days: 7

      - name: pip-audit CVE scan
        run: |
          uv export --extra api --no-dev --frozen > /tmp/requirements-audit.txt
          touch pip_audit_report.md
          uv tool run pip-audit \
            --requirement /tmp/requirements-audit.txt \
            --format markdown \
            --output pip_audit_report.md \
            || (cat pip_audit_report.md && exit 1)

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip_audit_report.md
          retention-days: 7
