[project]
name = "omnidl"
version = "20.3.2"
description = "Ultimate Media Downloader"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "yt-dlp>=2026.7.4",
    "gallery-dl>=1.32.1",
    "Pillow>=10.3.0",
    "requests>=2.31.0",
    "packaging>=23.0",
    "platformdirs>=4.0.0",
    "PySocks>=1.7.1",
    "keyring>=24.0.0",
    "cryptography>=41.0.0",
    "playwright>=1.40",
    "curl-cffi>=0.16.0",
    "loguru>=0.7.3",
    "ffmpeg-python>=0.2.0",
    "py7zr>=1.1.3",
    "pyzipper>=0.4.0",
	"weasyprint>=69.0",
    "markdown>=3.6",
    "pypdf>=4.2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.20.0",
    "types-requests>=2.31.0",
    "ruff>=0.4.0",
]
build = [
    "pyinstaller>=6.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.20.0",
    "types-requests>=2.31.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# UI files contain long CSS/QSS strings that cannot be meaningfully wrapped
"ui/*" = ["E501"]
# Test files contain long yt-dlp format selector strings used as assert literals
"tests/test_yt_dlp_engine.py" = ["E501"]
"tests/test_yt_dlp_engine_extra.py" = ["E501"]
"tests/test_coverage_boost.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "app", "domain", "infrastructure", "ui", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# main.py uses Windows-only ctypes (windll/WINFUNCTYPE) guarded by sys.platform
# checks at runtime; these are false positives on Linux CI.
# ui/* Qt stubs type layout() as Optional[QLayout] but it is always non-None
# after widget construction; plus windll in general_panel.py is Windows-only.
module = [
    "main",
    "ui.components.command_palette",
    "ui.components.download_item_widget",
    "ui.components.post_download_actions",
    "ui.components.toolbar",
    "ui.main_window",
    "ui.tabs.batch_tab",
    "ui.tabs.convert_tab",
    "ui.tabs.history_tab",
    "ui.tabs.home_tab",
    "ui.tabs.live_monitor_tab",
    "ui.tabs.settings._base_panel",
    "ui.tabs.settings.general_panel",
    "ui.tabs.settings.network_panel",
    "ui.tabs.settings.remote_api_panel",
    "ui.tabs.settings.taildrop_panel",
    "ui.tabs.settings.tools_panel",
    "ui.tabs.editor_tab",
    "app.services.ffmpeg_trim_service",
    "ui.tabs.special_dl_tab",
    "ui.theme_qt",
    "ui.tabs.archive_tab",
]
ignore_errors = true

[tool.coverage.run]
omit = [
    "api/*",
    "ui/*",
    "tests/*",
    "build/*",
    "main.py",
    "infrastructure/downloader/gallery_dl_engine.py",
    "infrastructure/downloader/facebook_story_engine.py",
    "infrastructure/downloader/kuaishou_engine.py",
    "utils/instagram_live_checker.py",
    "utils/tiktok_live_checker.py",
    "infrastructure/downloader/instagram_live_engine.py",
    "infrastructure/downloader/cookie_extractor.py",
    "infrastructure/downloader/cookie_storage.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
