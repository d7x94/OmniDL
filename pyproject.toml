[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.isort]
# Declare project-local packages so ruff places them in the FIRST-PARTY
# section (after third-party like customtkinter) and sorts them correctly.
known-first-party = ["api", "app", "domain", "infrastructure", "ui", "utils"]
